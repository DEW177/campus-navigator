server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API and backend images share the browser's origin, including on a phone.
    # Preserve the original port if FastAPI sends a canonical-path redirect.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/floorplans/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    location /static/landmarks/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    # React Router owns /search and /navigate?room=... on refresh as well.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
