# Optional local HTTPS for geolocation on a phone. See docs/CURRENT_LOCATION.md.
# Run with: docker compose -f docker-compose.yml -f docker-compose.https.yml up --build
services:
  https:
    image: nginx:alpine
    ports:
      - "3443:443"
    volumes:
      - ./infra/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
